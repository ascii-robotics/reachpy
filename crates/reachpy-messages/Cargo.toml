[package]
name = "reachpy-messages"
version = "0.1.2-alpha.3"
edition = "2021"
description = "ReachPy message system — Python-native runtime message definitions with dynamic schema-based binary serialization"

[lib]
name = "_reachpy_messages"
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
pyo3      = { version = "0.28", features = ["extension-module"] }
thiserror = "1.0"
byteorder = "1.5"

[dev-dependencies]
pyo3 = { version = "0.28", features = ["auto-initialize"] }